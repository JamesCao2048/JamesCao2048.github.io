name: Deploy website to GitHub Pages
# A deliberate manual cutover after content review and changing Pages to Actions.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check, build, and upload the static site
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6
        with:
          node-version: 22.22.0
          build-cmd: pnpm format:check && pnpm lint && pnpm build && pnpm validate && pnpm test:search
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
